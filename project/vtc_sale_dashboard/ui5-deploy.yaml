        ignoreCertErrors: true
        target:
          url: https://s35lp1.ucc.cit.tum.de:8100
          client: '302'
        app:
          name: ZVTC_SALE_DASH
          description: VinaTech Smart Sale Dashboard
          package: ZPK_SAP490_G9_SP26
          transport: S35K902879
        exclude:
          - /test/